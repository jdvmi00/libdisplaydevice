name: Undock trial
on:
  push:
    branches: [fix/undock-display-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true
      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-nodejs
      - name: Build and test display library
        run: |
          cmake -S . -B build -G Ninja -DBUILD_DOCS=OFF -DBUILD_TESTS=ON
          cmake --build build -j 4
          ./build/tests/test_libdisplaydevice.exe --gtest_output=xml:library-tests.xml
      - name: Prove regression against original recovery code
        run: |
          git fetch --depth=1 https://github.com/LizardByte/libdisplaydevice.git fe7e6a81f65deae91594702e1a185f47229745b9
          cp src/windows/settings_manager_revert.cpp build/revert-patched.cpp
          trap 'cp build/revert-patched.cpp src/windows/settings_manager_revert.cpp' EXIT
          git show fe7e6a81f65deae91594702e1a185f47229745b9:src/windows/settings_manager_revert.cpp > src/windows/settings_manager_revert.cpp
          cmake --build build -j 4
          if ./build/tests/test_libdisplaydevice.exe --gtest_filter=UndockRecovery.ClosedLidRetainsRecoveryUntilPanelAppears > regression-before.log 2>&1; then
            cat regression-before.log
            exit 1
          fi
          grep -F '[  FAILED  ] UndockRecovery.ClosedLidRetainsRecoveryUntilPanelAppears' regression-before.log
          cp build/revert-patched.cpp src/windows/settings_manager_revert.cpp
          trap - EXIT
          cmake --build build -j 4
          ./build/tests/test_libdisplaydevice.exe --gtest_output=xml:library-tests.xml
      - name: Fetch matching Sunshine source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: LizardByte/Sunshine
          ref: 14ffa6fdaa53f7b51512be2b3d24f3939695403c
          path: sunshine
          submodules: true
      - name: Build trial Sunshine
        env:
          BUILD_VERSION: 2026.516.143833-undock-trial
          BRANCH: undock-trial
          COMMIT: ${{ github.sha }}
        run: |
          git -C sunshine/third-party/moonlight-common-c submodule update --init --recursive --depth 1
          cp -r src/. sunshine/third-party/libdisplaydevice/src/
          cmake -S sunshine -B sunshine/build -G Ninja -DBUILD_DOCS=OFF -DBUILD_TESTS=ON -DBUILD_WERROR=ON -DCMAKE_BUILD_TYPE=Release -DSUNSHINE_ASSETS_DIR=assets -DSUNSHINE_PUBLISHER_NAME=jdvmi00 -DSUNSHINE_PUBLISHER_ISSUE_URL=https://github.com/jdvmi00/libdisplaydevice
          cmake --build sunshine/build -j 4
          cd sunshine/build/tests
          ./test_sunshine.exe --gtest_output=xml:sunshine-tests.xml
      - name: Save trial binary and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: undock-trial-windows
          path: |
            library-tests.xml
            regression-before.log
            sunshine/build/tests/sunshine-tests.xml
            sunshine/build/sunshine.exe
